<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Link da reunião</title>
<style>
  :root { --bg:#14161f; --text:#f2f3f8; --muted:#a9aebf; --accent:#7b83eb; --card:#1e212d; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 3vw;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2rem;
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center;
  }
  h1 { margin: 0; font-size: clamp(2rem, 4vw, 3.5rem); }
  .url {
    max-width: 90vw; padding: 1.2rem 1.6rem; background: var(--card); border-radius: 12px;
    font-family: ui-monospace, Consolas, monospace; font-size: clamp(.9rem, 1.4vw, 1.3rem);
    color: var(--muted); word-break: break-all; user-select: all;
  }
  .row { display: flex; gap: 1.5rem; flex-wrap: wrap; justify-content: center; align-items: center; }
  .btn {
    padding: 1.2rem 2.6rem; font-size: clamp(1.3rem, 2.2vw, 2rem); font-weight: 700;
    background: var(--accent); color: #fff; border: 0; border-radius: 12px;
    text-decoration: none; cursor: pointer; font-family: inherit;
  }
  .btn.alt { background: var(--card); color: var(--text); }
  .btn:focus, .btn:hover { outline: 5px solid #fff; outline-offset: 4px; }
  #qr { background: #fff; padding: 14px; border-radius: 12px; line-height: 0; }
  #qr:empty { display: none; }
  .hint { color: var(--muted); font-size: clamp(1rem, 1.5vw, 1.4rem); margin: 0; }
</style>
</head>
<body>
  <h1>Link da reunião</h1>

  <div class="url" id="url"></div>

  <div class="row">
    <a class="btn" id="open" href="#" autofocus>Abrir reunião</a>
    <button class="btn alt" id="copy" type="button">Copiar link</button>
  </div>

  <div id="qr"></div>
  <p class="hint">Na TV: use o controle e selecione “Abrir reunião”. No celular: aponte a câmera para o QR code.</p>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    const MEETING_URL = "https://teams.microsoft.com/light-meetings/launch?p=nXWUuorq5qndmurNCW&anon=true&launchAgent=join_launcher_web&lightExperience=true&correlationId=61c437d4-7a6a-4f75-adf6-1a6d01b29a7d&agent=web&coords=eyJtZWV0aW5nVXJsIjoiaHR0cHM6Ly90ZWFtcy5taWNyb3NvZnQuY29tL21lZXQvMjY4MzAxNzMwMzY1NjE1MD9wPW5YV1V1b3JxNXFuZG11ck5DVyZhbm9uPXRydWUmbGF1bmNoQWdlbnQ9am9pbl9sYXVuY2hlcl93ZWImbGlnaHRFeHBlcmllbmNlPXRydWUmY29ycmVsYXRpb25JZD02MWM0MzdkNC03YTZhLTRmNzUtYWRmNi0xYTZkMDFiMjlhN2QmYW5vbj10cnVlIiwibWVldGluZ0NvZGUiOiIyNjgzMDE3MzAzNjU2MTUwIiwicGFzc2NvZGUiOiJuWFdVdW9ycTVxbmRtdXJOQ1cifQ%3D%3D&deeplinkId=68f71bd3-88f7-4221-b47b-b25a444d1bf5";

    document.getElementById("url").textContent = MEETING_URL;
    document.getElementById("open").href = MEETING_URL;

    document.getElementById("copy").addEventListener("click", async (e) => {
      try { await navigator.clipboard.writeText(MEETING_URL); e.target.textContent = "Copiado!"; }
      catch { e.target.textContent = "Selecione o link acima"; }
    });

    try {
      new QRCode(document.getElementById("qr"), {
        text: MEETING_URL, width: 260, height: 260, correctLevel: QRCode.CorrectLevel.L
      });
    } catch (err) { /* sem QR code: o resto continua funcionando */ }
  </script>
</body>
</html>
