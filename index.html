<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Em Manutenção</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(145deg, #0b0f1a 0%, #1a1f2e 100%);
      color: #f0f4ff;
      padding: 1.5rem;
    }

    .maintenance-card {
      max-width: 720px;
      width: 100%;
      background: rgba(22, 28, 46, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 3.5rem;
      padding: 3rem 2.5rem;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.04);
      text-align: center;
      transition: transform 0.25s ease;
    }

    .maintenance-card:hover {
      transform: translateY(-6px);
    }

    .icon-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 2rem;
    }

    .gear-icon {
      display: inline-block;
      font-size: 4.8rem;
      line-height: 1;
      animation: spin 8s linear infinite;
      filter: drop-shadow(0 8px 16px rgba(0, 180, 255, 0.3));
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
      background: linear-gradient(135deg, #e0e9ff, #a0c8ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      line-height: 1.2;
    }

    .sub-headline {
      font-size: 1.2rem;
      font-weight: 400;
      color: #b6c8e5;
      margin-bottom: 2rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding-bottom: 1.5rem;
      letter-spacing: 0.3px;
    }

    .message-box {
      background: rgba(12, 17, 29, 0.6);
      border-radius: 2rem;
      padding: 1.75rem 1.5rem;
      margin-bottom: 2.5rem;
      border: 1px solid rgba(255, 255, 255, 0.03);
      box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.3);
    }

    .message-box p {
      font-size: 1.05rem;
      line-height: 1.6;
      color: #d3def5;
      font-weight: 350;
    }

    .message-box strong {
      color: #7bb3ff;
      font-weight: 500;
    }

    .countdown-grid {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin: 2rem 0 2.5rem;
      flex-wrap: wrap;
    }

    .time-unit {
      background: rgba(0, 0, 0, 0.35);
      border-radius: 2rem;
      padding: 0.6rem 1.2rem;
      min-width: 80px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.03);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.4);
    }

    .time-number {
      font-size: 2.2rem;
      font-weight: 700;
      display: block;
      line-height: 1.2;
      color: #f0f6ff;
      letter-spacing: 1px;
    }

    .time-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #8da1c9;
      font-weight: 500;
    }

    .status-badge {
      display: inline-block;
      background: rgba(0, 200, 150, 0.15);
      padding: 0.4rem 1.6rem;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 500;
      color: #7edfcb;
      border: 1px solid rgba(0, 255, 200, 0.15);
      backdrop-filter: blur(4px);
      margin-bottom: 1.2rem;
      letter-spacing: 0.5px;
    }

    .footer-note {
      margin-top: 2.2rem;
      font-size: 0.85rem;
      color: #6e7fa3;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
      padding-top: 1.8rem;
      letter-spacing: 0.3px;
    }

    .footer-note span {
      display: inline-block;
      background: rgba(255, 255, 255, 0.02);
      padding: 0.2rem 1rem;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.02);
    }

    /* Responsivo */
    @media (max-width: 500px) {
      .maintenance-card {
        padding: 2rem 1.5rem;
        border-radius: 2.5rem;
      }

      h1 {
        font-size: 2.2rem;
      }

      .gear-icon {
        font-size: 3.8rem;
      }

      .countdown-grid {
        gap: 0.6rem;
      }

      .time-unit {
        min-width: 65px;
        padding: 0.4rem 0.8rem;
      }

      .time-number {
        font-size: 1.8rem;
      }

      .message-box p {
        font-size: 0.95rem;
      }
    }

    @media (max-width: 380px) {
      .time-unit {
        min-width: 55px;
        padding: 0.3rem 0.5rem;
      }
      .time-number {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="maintenance-card" role="main" aria-label="Página em manutenção">
    
    <div class="icon-wrapper">
      <span class="gear-icon" aria-hidden="true">⚙️</span>
    </div>

    <h1>Em manutenção</h1>
    <p class="sub-headline">Estamos melhorando a experiência para você</p>

    <div class="status-badge">
      🔄  Atualização em andamento
    </div>

    <div class="message-box">
      <p>
        <strong>Estamos trabalhando duro</strong> para trazer novidades incríveis. 
        Nosso site estará disponível em breve. 
        Agradecemos pela paciência e compreensão.
      </p>
    </div>

    <!-- Contador regressivo simples (exemplo: 2h 30min) -->
    <div class="countdown-grid" id="countdown">
      <div class="time-unit">
        <span class="time-number" id="hours">02</span>
        <span class="time-label">Horas</span>
      </div>
      <div class="time-unit">
        <span class="time-number" id="minutes">30</span>
        <span class="time-label">Minutos</span>
      </div>
      <div class="time-unit">
        <span class="time-number" id="seconds">00</span>
        <span class="time-label">Segundos</span>
      </div>
    </div>

    <div class="footer-note">
      <span>🔧  previsão de retorno: hoje, 18h30</span>
    </div>
  </div>

  <script>
    (function() {
      // Tempo alvo: 2 horas e 30 minutos a partir do carregamento da página.
      // Definimos 2h30 = 2*3600 + 30*60 = 9000 segundos.
      const TARGET_SECONDS = 2 * 3600 + 30 * 60; // 9000s

      // Armazena o timestamp de início (momento em que a página carregou)
      const startTime = Date.now();
      // Calcula o tempo final absoluto (em ms)
      const endTime = startTime + TARGET_SECONDS * 1000;

      function updateCountdown() {
        const now = Date.now();
        let remaining = Math.max(0, Math.floor((endTime - now) / 1000));

        // Se acabou o tempo, resetamos para 00:00:00 e mantemos
        if (remaining <= 0) {
          document.getElementById('hours').textContent = '00';
          document.getElementById('minutes').textContent = '00';
          document.getElementById('seconds').textContent = '00';
          return;
        }

        const hrs = Math.floor(remaining / 3600);
        const mins = Math.floor((remaining % 3600) / 60);
        const secs = remaining % 60;

        // Formata com dois dígitos
        document.getElementById('hours').textContent = String(hrs).padStart(2, '0');
        document.getElementById('minutes').textContent = String(mins).padStart(2, '0');
        document.getElementById('seconds').textContent = String(secs).padStart(2, '0');
      }

      // Atualiza imediatamente e depois a cada segundo
      updateCountdown();
      setInterval(updateCountdown, 1000);
    })();
  </script>
</body>
</html>
